name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  datasets:
    # Regenerates evals/datasets/reference/*.json from the seed .bicep sources and fails
    # if that drifts from what's committed (i.e. someone changed a seed .bicep/knowledge_base
    # doc without regenerating). No LLM/AWS/human input is involved -- see
    # scripts/create_langsmith_dataset.py and evals/datasets/README.md.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Azure CLI + Bicep
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az bicep install
      - name: Regenerate datasets (local-only) and fail on drift
        run: |
          python scripts/create_langsmith_dataset.py --local-only
          git diff --exit-code -- evals/datasets/reference/
      - name: Push to LangSmith (main branch only, skipped if no API key configured)
        if: github.ref == 'refs/heads/main' && secrets.LANGSMITH_API_KEY != ''
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: bicep-to-cfn-migration
        run: python scripts/create_langsmith_dataset.py --dataset-name bicep-to-cfn-migration-v1
